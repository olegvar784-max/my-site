name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# одновременно выполняется только одно развёртывание Pages
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Задача 1: проверка качества кода (CI)
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'            # кэш зависимостей по package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build

      - name: Check links in build      # дополнительное задание: проверка ссылок
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress 'dist/**/*.html'
          fail: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/

  # Задача 2: развёртывание (CD)
  deploy:
    name: Deploy to GitHub Pages
    needs: ci                              # только после успешной проверки
    if: github.ref == 'refs/heads/main'    # на Pull Request не выполняется
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
